<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="RiyadhTowers - A premium Monopoly-style board game set in Riyadh">
  <title>أبراج الرياض | RiyadhTowers</title>

  <!-- Preload critical fonts so they download during JS parsing -->
  <link rel="preload" href="fonts/Tajawal-Bold.ttf" as="font" type="font/truetype" crossorigin>
  <link rel="preload" href="fonts/FredokaOne-Regular.ttf" as="font" type="font/truetype" crossorigin>
  <link rel="preload" href="fonts/Tajawal-ExtraBold.ttf" as="font" type="font/truetype" crossorigin>

  <style>
    /* Local fonts — ZERO network requests */
    @font-face {
      font-family: 'Fredoka One';
      src: url('fonts/FredokaOne-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060E1A;
      -webkit-user-select: none;
      user-select: none;
      cursor: none;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }

    /* ============================================
       CSS Loading Screen — visible INSTANTLY
       Covers the 3-5s JS parsing delay on Tizen TV
       ============================================ */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #060E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    /* Crescent moon */
    .ls-moon {
      position: relative;
      width: 60px;
      height: 60px;
      margin-bottom: 28px;
    }
    .ls-moon::before {
      content: '';
      position: absolute;
      top: 0; left: 5px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: #C8A951;
    }
    .ls-moon::after {
      content: '';
      position: absolute;
      top: -5px; left: 20px;
      width: 45px; height: 45px;
      border-radius: 50%;
      background: #060E1A;
    }
    .ls-title {
      font-family: serif;
      font-size: 52px;
      color: #C8A951;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .ls-subtitle {
      font-family: sans-serif;
      font-size: 18px;
      color: #7B93B8;
      letter-spacing: 6px;
      margin-bottom: 36px;
    }
    .ls-spinner {
      width: 32px; height: 32px;
      border: 3px solid #1E3355;
      border-top-color: #C8A951;
      border-radius: 50%;
      animation: ls-spin 0.7s linear infinite;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- CSS Loading Screen — renders within 50ms, covers JS parsing delay -->
  <div id="loading-screen">
    <div class="ls-moon"></div>
    <div class="ls-title">أبراج الرياض</div>
    <div class="ls-subtitle">RIYADHTOWERS</div>
    <div class="ls-spinner"></div>
  </div>

  <!-- Game container -->
  <div id="game-container"></div>

  <!-- Phaser 3 (local bundle — no CDN fetch) -->
  <script src="lib/phaser.min.js"></script>
  <!-- Single bundled game script (1 file load instead of 10) -->
  <script src="game.js"></script>

  <!-- Game Bootstrap — starts IMMEDIATELY, no network waits -->
  <script>
    (function() {
      var config = {
        type: Phaser.WEBGL,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: 'game-container',
        backgroundColor: '#060E1A',
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
        },
        scene: [
          PreloaderScene,
          MenuScene,
          PlayerSetupScene,
          BoardScene,
          GameOverScene
        ],
        fps: {
          target: 60,
          forceSetTimeOut: false,
        },
        render: {
          antialias: false,
          pixelArt: false,
          transparent: false,
          powerPreference: 'high-performance',
          batchSize: 4096,
          maxLights: 0,
          roundPixels: true,
        },
        input: {
          keyboard: true,
          mouse: false,
          touch: false,
        },
        audio: {
          disableWebAudio: false,
        },
      };

      var game = new Phaser.Game(config);

      // Prevent default browser behavior for arrow keys
      window.addEventListener('keydown', function(e) {
        if ([37, 38, 39, 40, 13, 27].indexOf(e.keyCode) !== -1) {
          e.preventDefault();
        }
      });

      // Samsung Tizen TV back button handler
      if (typeof tizen !== 'undefined') {
        document.addEventListener('tizenhwkey', function(e) {
          if (e.keyName === 'back') {
            var event = new KeyboardEvent('keydown', { keyCode: 27 });
            document.dispatchEvent(event);
          }
        });
      }
    })();
  </script>
</body>
</html>
