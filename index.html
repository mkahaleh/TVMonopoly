<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="RiyadhTowers - A premium Monopoly-style board game set in Riyadh">
  <title>أبراج الرياض | RiyadhTowers</title>

  <style>
    /* Local fonts — ZERO network requests */
    @font-face {
      font-family: 'Fredoka One';
      src: url('fonts/FredokaOne-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('fonts/Tajawal-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A1628;
      -webkit-user-select: none;
      user-select: none;
      cursor: none;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- Game container -->
  <div id="game-container"></div>

  <!-- Phaser 3 (local bundle — no CDN fetch) -->
  <script src="lib/phaser.min.js"></script>
  <!-- Single bundled game script (1 file load instead of 10) -->
  <script src="game.js"></script>

  <!-- Game Bootstrap — starts IMMEDIATELY, no network waits -->
  <script>
    (function() {
      var config = {
        type: Phaser.WEBGL,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: 'game-container',
        backgroundColor: '#060E1A',
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
        },
        scene: [
          PreloaderScene,
          MenuScene,
          PlayerSetupScene,
          BoardScene,
          GameOverScene
        ],
        fps: {
          target: 30,
          forceSetTimeOut: false,
        },
        render: {
          antialias: false,
          pixelArt: false,
          transparent: false,
          powerPreference: 'high-performance',
          batchSize: 4096,
          maxLights: 0,
          roundPixels: true,
        },
        input: {
          keyboard: true,
          mouse: false,
          touch: false,
        },
        audio: {
          disableWebAudio: false,
        },
      };

      var game = new Phaser.Game(config);

      // Prevent default browser behavior for arrow keys
      window.addEventListener('keydown', function(e) {
        if ([37, 38, 39, 40, 13, 27].indexOf(e.keyCode) !== -1) {
          e.preventDefault();
        }
      });

      // Samsung Tizen TV back button handler
      if (typeof tizen !== 'undefined') {
        document.addEventListener('tizenhwkey', function(e) {
          if (e.keyName === 'back') {
            var event = new KeyboardEvent('keydown', { keyCode: 27 });
            document.dispatchEvent(event);
          }
        });
      }
    })();
  </script>
</body>
</html>
